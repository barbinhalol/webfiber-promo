const capEls=CAPS.map(c=>{const el=E('div','cap '+c.st,caps,'<span class="tx">'+c.t+'</span>');if(c.fs)el.style.fontSize=c.fs+'px';el._c=c;el._plain=c.t.replace(/<[^>]+>/g,'');el._html=c.t;return el;});
function updateCaps(t){
  for(const el of capEls){
    const c=el._c;
    if(t<c.s||t>=c.e){el.style.display='none';continue;}
    el.style.display='block';
    const din=c.a==='slam'?.22:c.a==='type'?Math.min(.9,(c.e-c.s)*.45):.35, dout=.14;
    const pin=seg(t,c.s,c.s+din), pout=seg(t,c.e-dout,c.e), hold=seg(t,c.s,c.e);
    let sc=1,op=1,rot=c.rot||0,dx=0,dy=0;
    if(c.a==='pop'){sc=eob(pin);op=clamp(pin*3);rot=rot*(1-eo(pin))*2+rot;}
    else if(c.a==='slam'){const q=eoe(pin);sc=1+2.4*(1-q);op=pin>0?clamp(pin*8):0;if(pin<1){dx=jit(t,60)*18*(1-pin);dy=jit(t+3,60)*18*(1-pin);}}
    else if(c.a==='type'){sc=1;op=1;const tx=el.firstChild;const n=Math.floor(eo(pin)*el._plain.length);
      if(pin<1){let out='',cnt=0,inTag=false;for(const ch of el._html){if(ch==='<')inTag=true;if(inTag){out+=ch;if(ch==='>')inTag=false;continue;}if(cnt<n)out+=ch;cnt++;}tx.innerHTML=out+'<i class="cur"></i>';}
      else if(tx.innerHTML!==el._html) tx.innerHTML=el._html;}
    const z=(c.zo||0)*.07*hold; sc*= (c.zo>0?1+z:c.zo<0?1.07-(-z):1);
    sc*=1-.25*pout; op*=1-pout;
    const w=el.offsetWidth,h=el.offsetHeight;
    el.style.transform=`translate(${c.x*W-w/2+dx}px,${c.y-h/2+dy}px) rotate(${rot}deg) scale(${sc})`;
    el.style.opacity=op;
  }
}

/* ---------- MAIN RENDER ---------- */
const fxred=$('#fxred'),fxwhite=$('#fxwhite'),tears=$('#tears'),pfill=$('#pfill'),tc=$('#tc'),meterBars=[...document.querySelectorAll('#meter b')],boot=$('#boot'),bootLines=[...document.querySelectorAll('#boot .l')],black=$('#black'),fim=$('#fim'),vframe=$('#vframe'),hud=$('#hud');
const tearEls=[0,1,2,3,4].map(()=>E('div','tear',tears));
function render(t){
  t=clamp(t,0,DUR);
  const L=layoutAt(t);
  // video transform
  let sc=L.s, y=L.y, x=0, rot=L.r;
  const env=envAt(t);
  sc*=1+.035*Math.sin(t*.55)+.02*env;
  for(const p of PUNCH){const d=t-p;if(d>=0&&d<.7)sc*=1+.12*Math.exp(-d*7);}
  for(const s of SHAKE){if(t>=s[0]&&t<s[1]){x+=jit(t,s[2])*8;y+=jit(t+5,s[2])*8;rot+=jit(t+9,s[2])*.6;}}
  if(L.mode==='full'&&!L.transitioning){rot+=Math.sin(t*.4)*.4;}
  vwrap.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg) scale(${sc})`;
  vsurf.style.borderRadius=L.rad+'px';vframe.style.borderRadius=L.rad+'px';vframe.style.borderWidth=L.bd+'px';
  // video look
  const red=REDFLASH.reduce((a,f)=>{const d=t-f[0];return a+(d>=0?f[1]*Math.exp(-d*4.5):0)},0);
  const dark=(t>=38.6&&t<41.25)?.35:(t>=7.85&&t<10.35)?.25:0;
  vsurf.style.filter=`grayscale(${.55+dark*.9}) contrast(${1.15+dark*.3}) brightness(${.85-dark*.25}) saturate(.9)`;
  fxred.style.opacity=clamp(red);
  fxwhite.style.opacity=WHITEFLASH.reduce((a,f)=>{const d=t-f[0];return a+(d>=0?f[1]*Math.exp(-d*12):0)},0);
  // glitch tears
  let g=0;for(const gt of GLITCH){const d=t-gt;if(d>=0&&d<.16)g=Math.max(g,1-d/.16);}
  const fi=Math.floor(t*FPS);
  tearEls.forEach((e,i)=>{if(g<=0){e.style.display='none';return;}e.style.display='block';const h=10+rnd(fi*7+i)*70;e.style.top=(rnd(fi*13+i*3)*H)+'px';e.style.height=h+'px';e.style.transform=`translateX(${(rnd(fi*5+i)-.5)*120*g}px)`;e.style.opacity=g;});
  stage.style.transform=`${stage._fit||''} translate(${g?(rnd(fi*3)-.5)*24:0}px,0)`;
  // hud
  pfill.style.width=(t/DUR*100)+'%';
  const ss=Math.floor(t),ff=Math.floor((t-ss)*FPS);tc.textContent=`REC 00:${String(ss).padStart(2,'0')}:${String(ff).padStart(2,'0')}`;
  $('#rec i').style.opacity=Math.floor(t*2)%2?1:.25;
  meterBars.forEach((b,i)=>{const lv=clamp(env*1.3-i*.02+jit(t+i,40)*.08);b.style.height=(6+lv*64)+'px';b.style.background=i>5?'#ff2a3c':'#f2f2f0';});
  hud.style.opacity=t<1?0:clamp((t-1)*2)*(t>48.9?clamp((49.13-t)/.2):1);
  // boot + fades
  const bootOn=t<1.15;boot.style.display=bootOn?'flex':'none';
  if(bootOn){bootLines.forEach((l,i)=>{const q=seg(t,.08+i*.22,.2+i*.22);l.style.opacity=q;l.style.transform=`translateX(${(1-q)*-20}px)`;});boot.style.opacity=1-seg(t,.9,1.15);}
  black.style.opacity=seg(t,48.95,49.13);
  fim.style.opacity=0;
  // scenes
  for(const s of SCENES){const on=t>=s.s&&t<s.e;s.el.style.display=on?'block':'none';if(on)s.update(t,s,s.st);}
  updateCaps(t);
}

  vid.style.display='none';vimg.style.display='block';$('#tap').style.display='none';
  const dir=Q.get('frames')||'vframes';
  window.__seek=async t=>{const i=clamp(Math.round(t*FPS)+1,1,ENV.length);vimg.src=`${dir}/f${String(i).padStart(5,'0')}.jpg`;try{await vimg.decode()}catch(e){}render(t);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));return true;};
  window.__ready=document.fonts.ready.then(()=>true);
}else{
  vimg.style.display='none';
  vid.src=Q.get('src')||'video.mp4';
  const tap=$('#tap');
  let raf;const loop=()=>{render(vid.currentTime);raf=requestAnimationFrame(loop);};
  tap.addEventListener('click',()=>{tap.style.display='none';vid.currentTime=0;vid.play();cancelAnimationFrame(raf);loop();});
  vid.addEventListener('ended',()=>{cancelAnimationFrame(raf);render(DUR);tap.style.display='flex';tap.querySelector('span').textContent='↻ REPETIR';});
  document.fonts.ready.then(()=>render(0));
}
</script>
</body>
</html>
